[project]
name = "apiverve-fullyqualifieddomain"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Fully Qualified Domain resolves an IP address to its fully qualified domain name using reverse DNS PTR records. It returns the host FQDN, base domain, TLD, subdomain, and domain level count."
keywords = ["fqdn api", "reverse dns lookup", "ip to fqdn", "ip to hostname", "ptr record lookup"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/fullyqualifieddomain?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/fullyqualifieddomain?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/fullyqualifieddomain-api"
Twitter = "https://twitter.com/apivervehq"
